services:
  api:
    build: .
    ports:
      - "8000:8000"
    # Local: secrets from gitignored .env (see README — Environment configuration).
    # Production: prefer platform env / secret manager; do not bake secrets into the image.
    env_file:
      - .env
    environment:
      # Optional overrides for local compose; production should set these on the host.
      # ENVIRONMENT: production
      # COOKIE_SECURE: "1"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    volumes:
      - ./projects:/app/projects
      - ./style_guide.json:/app/style_guide.json:ro
      - ./references:/app/references:ro
      - ./prompts:/app/prompts:ro
    restart: unless-stopped
